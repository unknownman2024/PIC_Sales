name: Update Chain Daily Advance

on:
  schedule:
    - cron: "*/40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chain-daily-advance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔄 Sync with Remote
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"

          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          pip install requests pytz

      - name: ▶ Run Script (unbuffered)
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python -u chain_daily_advance.py

      - name: 🔍 Check Generated Files
        run: |
          echo "📂 Chain Daily Advance:"
          ls -lah "Chain Daily Advance"

          echo ""
          echo "📄 Current month:"
          ls -lh "Chain Daily Advance/$(TZ='Asia/Kolkata' date '+%Y-%m').json" || true

          echo ""
          echo "🔍 Git status:"
          git status --short

      - name: 🔄 Commit & Push if Changes Exist
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"

          git add -A

          echo "📦 Staged changes:"
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "✔ No changes — nothing to commit"
            exit 0
          fi

          echo "📌 Changes found — committing"

          TIMESTAMP=$(TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST')
          git commit -m "Auto-update Chain Daily Advance | $TIMESTAMP"

          echo "🚀 Pushing changes..."
          git push origin "${GITHUB_REF_NAME}"
